<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pull the Piñata</title>
<style>
body {
  background: #121212;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.card {
  background: #1e1e1e;
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  padding: 24px;
  width: 100%;
  max-width: 400px;
  text-align: center;
  color: #fff;
  position: relative;
}

input[type="number"] {
  width: calc(100% - 22px);
  padding: 10px;
  margin-bottom: 16px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #222;
  color: #fff;
}

.error {
  color: #ff5555;
  font-size: 0.9em;
  margin-bottom: 16px;
}

img {
  width: 200px;
  height: auto;
  cursor: pointer;
  transition: transform 0.3s, opacity 0.3s;
}

.broken {
  transform: scale(1.5);
  opacity: 0;
}

.number {
  font-size: 4em;
  font-weight: bold;
  margin-top: 16px;
  color: #00bfff;
  opacity: 0;
  transform: scale(0);
}

.reset-button {
  background-color: #00bfff;
  border: none;
  border-radius: 8px;
  color: #fff;
  padding: 10px 20px;
  cursor: pointer;
  margin-top: 16px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.3s, transform 0.3s;
}

.reset-button:hover {
  background-color: #00a2e8;
}

.shake {
  animation: shake 0.2s;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
  20%, 40%, 60%, 80% { transform: translateX(10px); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideIn {
  from { transform: translateY(20px); }
  to { transform: translateY(0); }
}
</style>
</head>
<body>
<div class="card">
  <input type="number" id="maxInput" placeholder="Max">
  <div class="error" id="errorMessage"></div>
  <img id="pinata" src="https://cdn.jsdelivr.net/gh/hfg-gmuend/openmoji/color/svg/1FA85.svg" alt="Piñata">
  <div class="instruction">Click the piñata to reveal your number!</div>
  <div class="number" id="numberDisplay"></div>
  <button class="reset-button" id="resetButton">Reset</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tsparticles@1.34.0/dist/tsparticles.min.js"></script>
<script>
  const maxInput = document.getElementById('maxInput');
  const errorMessage = document.getElementById('errorMessage');
  const pinata = document.getElementById('pinata');
  const numberDisplay = document.getElementById('numberDisplay');
  const resetButton = document.getElementById('resetButton');
  let isPinataClicked = false;
  let maxNumber = 0;

  pinata.addEventListener('click', () => {
    if (!isPinataClicked) {
      validateAndProceed();
    }
  });

  resetButton.addEventListener('click', () => {
    resetGame();
  });

  function validateAndProceed() {
    maxNumber = parseInt(maxInput.value);
    if (maxNumber <= 1 || isNaN(maxNumber)) {
      errorMessage.textContent = "Please enter a positive integer greater than 1.";
      return;
    }
    errorMessage.textContent = "";
    startGame();
  }

  function startGame() {
    pinata.classList.add('shake');
    setTimeout(() => {
      pinata.classList.remove('shake');
      pinata.classList.add('broken');
      setTimeout(() => {
        pinata.classList.remove('broken');
        confetti();
        displayRandomNumber();
      }, 300);
    }, 200);
    isPinataClicked = true;
  }

  function displayRandomNumber() {
    const finalNumber = Math.floor(Math.random() * maxNumber) + 1;
    console.log(finalNumber); // Debugging line to check the value of finalNumber
    console.log(typeof finalNumber); // Ensure finalNumber is an integer
    gsap.to(numberDisplay, {
      duration: 4,
    textContent: finalNumber,
    snap: { textContent: 1 },
      opacity: 1,
      transform: "scale(1)",
      ease: "elastic.out(1, 0.5)"
    });
    gsap.to(resetButton, {
      duration: 0.3,
      opacity: 1,
      transform: "translateY(0)"
    });
    pinata.style.display = 'none';
  }

  function resetGame() {
    gsap.to(numberDisplay, {
      duration: 0.3,
      opacity: 0,
      transform: "scale(0)"
    });
    gsap.to(resetButton, {
      duration: 0.3,
      opacity: 0,
      transform: "translateY(20px)"
    });
    setTimeout(() => {
      pinata.style.display = '';
      pinata.classList.remove('broken');
      pinata.classList.add('shake');
      setTimeout(() => {
        pinata.classList.remove('shake');
      }, 200);
      isPinataClicked = false;
    }, 300);
  }

  particlesJS.load('tsparticles', {
    "particles": {
      "number": {
        "value": 80,
        "density": {
          "enable": true,
          "value_area": 800
        }
      },
      "color": {
        "value": "#ffffff"
      },
      "shape": {
        "type": "circle",
        "stroke": {
          "width": 0,
          "color": "#000000"
        },
        "polygon": {
          "nb_sides": 5
        },
        "image": {
          "src": "img/github.svg",
          "width": 100,
          "height": 100
        }
      },
      "opacity": {
        "value": 0.5,
        "random": false,
        "anim": {
          "enable": false,
          "speed": 1,
          "opacity_min": 0.1,
          "sync": false
        }
      },
      "size": {
        "value": 3,
        "random": true,
        "anim": {
          "enable": false,
          "speed": 40,
          "size_min": 0.1,
          "sync": false
        }
      },
      "line_linked": {
        "enable": false,
        "distance": 150,
        "color": "#ffffff",
        "opacity": 0.4,
        "width": 1
      },
      "move": {
        "enable": true,
        "speed": 6,
        "direction": "none",
        "random": false,
        "straight": false,
        "out_mode": "out",
        "bounce": false,
        "attract": {
          "enable": false,
          "rotateX": 600,
          "rotateY": 1200
        }
      }
    },
    "interactivity": {
      "detect_on": "canvas",
      "events": {
        "onhover": {
          "enable": true,
          "mode": "repulse"
        },
        "onclick": {
          "enable": true,
          "mode": "push"
        },
        "resize": true
      },
      "modes": {
        "grab": {
          "distance": 400,
          "line_linked": {
            "opacity": 1
          }
        },
        "bubble": {
          "distance": 400,
          "size": 40,
          "duration": 2,
          "opacity": 8,
          "speed": 3
        },
        "repulse": {
          "distance": 200,
          "duration": 0.4
        },
        "push": {
          "particles_nb": 4
        },
        "remove": {
          "particles_nb": 2
        }
      }
    },
    "retina_detect": true
  });
</script>
</body>
</html>
